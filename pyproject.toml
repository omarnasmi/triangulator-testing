[tool.ruff.lint]
select = [
    "D",
    "E",
    "F",
    "UP",
    "B",
    "SIM",
    "I",
]

[tool.pytest.ini_options]
markers = [
    "performance: tests that measure execution time",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "**/tests/*",
    "**/__pycache__/*",
    "*.pyc",
    ".venv/*",
    "**/.venv/*",
    "build/*",
    "dist/*",
    "htmlcov/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 90
